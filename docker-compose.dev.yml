services:
  neon-local:
    image: neondatabase/neon_local:latest
    container_name: neon-local
    ports:
      - '5432:5432'
    env_file:
      - .env.development

  app:
    build:
      context: .
      target: development
    container_name: aquisitions-app-dev
    depends_on:
      - neon-local
    env_file:
      - .env.development
    ports:
      - '3000:3000'
    volumes:
      - ./:/app
      - /app/node_modules
    command: npm run dev
